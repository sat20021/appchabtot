version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - phonetech_network

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - phonetech_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - phonetech_network

  celery_worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - phonetech_network

  celery_beat:
    build: .
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - phonetech_network

networks:
  phonetech_network:
    driver: bridge

volumes:
  mongodb_data:
